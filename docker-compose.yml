services:
  neo4j:
    image: neo4j:5
    container_name: cognis-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD using --env-file backend/.env}
    volumes:
      - cognis_neo4j_data:/data

volumes:
  cognis_neo4j_data:
